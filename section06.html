<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>곡선 겹치는 산 - 윗부분만 hover 효과</title>
  <style>
    body {
      background-color: #f1f8ba;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 80vw;
      height: auto;
      position: relative;
    }

    .mountain {
      transition: d 0.3s, opacity 0.3s;
      cursor: pointer;
    }

    .label {
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      transform: translate(-50%, -10px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div style="position: relative;">
    <svg viewBox="0 0 800 400">
      <path class="mountain" data-name="Inwangsan" data-height="338m"
        data-original="M 0 400 Q 100 150 200 400 T 400 400 L 0 400 Z"
        data-hover="M 0 400 Q 100 130 200 400 T 400 400 L 0 400 Z"
        d="M 0 400 Q 100 150 200 400 T 400 400 L 0 400 Z"
        fill="#1e6f5c" opacity="0.6" />
      <path class="mountain" data-name="Gwanaksan" data-height="632m"
        data-original="M 100 400 Q 250 100 400 400 T 700 400 L 100 400 Z"
        data-hover="M 100 400 Q 250 80 400 400 T 700 400 L 100 400 Z"
        d="M 100 400 Q 250 100 400 400 T 700 400 L 100 400 Z"
        fill="#3c7845" opacity="0.5" />
      <path class="mountain" data-name="Seoraksan" data-height="1,708m"
        data-original="M 200 400 Q 400 50 600 400 T 800 400 L 200 400 Z"
        data-hover="M 200 400 Q 400 30 600 400 T 800 400 L 200 400 Z"
        d="M 200 400 Q 400 50 600 400 T 800 400 L 200 400 Z"
        fill="#2f3e77" opacity="0.7" />
      <path class="mountain" data-name="Cheonggyesan" data-height="620m"
        data-original="M 300 400 Q 500 120 700 400 T 900 400 L 300 400 Z"
        data-hover="M 300 400 Q 500 100 700 400 T 900 400 L 300 400 Z"
        d="M 300 400 Q 500 120 700 400 T 900 400 L 300 400 Z"
        fill="#7aa95c" opacity="0.4" />
      <path class="mountain" data-name="Dobongsan" data-height="739m"
        data-original="M 400 400 Q 600 180 800 400 T 1000 400 L 400 400 Z"
        data-hover="M 400 400 Q 600 160 800 400 T 1000 400 L 400 400 Z"
        d="M 400 400 Q 600 180 800 400 T 1000 400 L 400 400 Z"
        fill="#2b8c84" opacity="0.5" />
    </svg>

    <div class="label" id="tooltip"></div>
  </div>

  <script>
    const tooltip = document.getElementById('tooltip');
    const mountains = document.querySelectorAll('.mountain');

    mountains.forEach(mountain => {
      mountain.addEventListener('mousemove', e => {
        const name = mountain.getAttribute('data-name');
        const height = mountain.getAttribute('data-height');
        tooltip.textContent = `${name} (${height})`;
        tooltip.style.left = `${e.pageX}px`;
        tooltip.style.top = `${e.pageY - 30}px`;
        tooltip.classList.add('show');
      });

      mountain.addEventListener('mouseenter', () => {
        mountain.setAttribute('d', mountain.getAttribute('data-hover'));
      });

      mountain.addEventListener('mouseleave', () => {
        mountain.setAttribute('d', mountain.getAttribute('data-original'));
        tooltip.classList.remove('show');
      });
    });
  </script>
</body>
</html>
