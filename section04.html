<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Mugs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #E6D5B8; /* 황토색 배경 */
    }

    .coffee-mug-container {
      display: flex;
      justify-content: space-between;
      width: 90%;
      max-width: 900px;
    }

    .coffee-mug {
      width: 60px;
      height: 80px;
      position: relative;
      transition: all 0.3s ease;
    }

    .mug {
      width: 50px;
      height: 70px;
      background-color: #e2e2e2;
      border-radius: 4px 4px 15px 15px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    .handle {
      position: absolute;
      right: -10px;
      top: 15px;
      width: 12px;
      height: 20px;
      border: 5px solid #e2e2e2;
      border-left: none;
      border-radius: 0 10px 10px 0;
    }

    .coffee {
      width: 100%;
      height: 0;
      background-color: #6f4f37;
      position: absolute;
      bottom: 0;
      transition: height 0.5s ease;
    }

    .wave {
      position: absolute;
      top: -5px;
      left: 0;
      width: 100%;
      height: 10px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 50 5" xmlns="http://www.w3.org/2000/svg"><path d="M0,2.5 C5,5 10,0 15,2.5 C20,5 25,0 30,2.5 C35,5 40,0 45,2.5 C50,5 50,0 50,2.5 L50,5 L0,5 Z" fill="%236f4f37"/></svg>') repeat-x;
      background-size: 50px 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: wave 1s linear infinite;
    }

    .day {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }

    /* 말풍선 스타일 */
    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
      margin-bottom: 10px;
      pointer-events: none;
    }

    .tooltip:after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #333 transparent transparent transparent;
    }

    .coffee-mug:hover {
      transform: translateY(-10px);
    }

    .coffee-mug:hover .tooltip {
      opacity: 1;
    }

    @keyframes wave {
      0% {
        background-position-x: 0;
      }
      100% {
        background-position-x: 50px;
      }
    }

    /* Custom fill levels for each day on hover */
    #monday:hover .coffee {
      height: 20%;
    }
    #tuesday:hover .coffee {
      height: 50%;
    }
    #wednesday:hover .coffee {
      height: 10%;
    }
    #thursday:hover .coffee {
      height: 60%;
    }
    #friday:hover .coffee {
      height: 0%;
    }
    #saturday:hover .coffee {
      height: 20%;
    }
    #sunday:hover .coffee {
      height: 100%;
    }

    /* Show wave effect only when hovering */
    .coffee-mug:hover .wave {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="coffee-mug-container">
    <div class="coffee-mug" id="monday">
      <div class="tooltip">Caffeine: 40mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Mon</div>
    </div>
    <div class="coffee-mug" id="tuesday">
      <div class="tooltip">Caffeine: 100mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Tue</div>
    </div>
    <div class="coffee-mug" id="wednesday">
      <div class="tooltip">Caffeine: 20mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Wed</div>
    </div>
    <div class="coffee-mug" id="thursday">
      <div class="tooltip">Caffeine: 120mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Thu</div>
    </div>
    <div class="coffee-mug" id="friday">
      <div class="tooltip">No caffeine</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Fri</div>
    </div>
    <div class="coffee-mug" id="saturday">
      <div class="tooltip">Caffeine: 40mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Sat</div>
    </div>
    <div class="coffee-mug" id="sunday">
      <div class="tooltip">Caffeine: 200mg</div>
      <div class="mug">
        <div class="coffee">
          <div class="wave"></div>
        </div>
      </div>
      <div class="handle"></div>
      <div class="day">Sun</div>
    </div>
  </div>

</body>
</html>
